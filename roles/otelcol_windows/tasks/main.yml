---
# Install xscaler-collector on a Windows host. The opampsupervisor role installs
# the MSI and enrolls the supervisor; fleet manager owns collector config.

- name: Set Windows fleet labels
  ansible.builtin.set_fact:
    _xscaler_agent_labels_effective: "{{ {'agent_profile': 'windows_host'} | combine(xscaler_agent_labels | default({})) }}"

- name: Install and configure xscaler-collector
  ansible.builtin.include_role:
    name: opampsupervisor
  vars:
    opampsupervisor_agent_labels: "{{ _xscaler_agent_labels_effective }}"
