---
- name: Restart xscaler-collector linux
  listen: Restart xscaler-collector
  ansible.builtin.systemd:
    name: "{{ opampsupervisor_linux_service_name }}"
    state: restarted
    daemon_reload: true
  when: ansible_facts['os_family'] != "Windows"

- name: Restart xscaler-collector windows
  listen: Restart xscaler-collector
  ansible.windows.win_service:
    name: "{{ opampsupervisor_windows_service_name }}"
    state: restarted
  when: ansible_facts['os_family'] == "Windows"
