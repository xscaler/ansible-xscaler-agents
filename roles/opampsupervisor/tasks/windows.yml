---
- name: Set Windows supervisor facts
  ansible.builtin.set_fact:
    opampsupervisor_platform: windows
    opampsupervisor_arch: "{{ 'amd64' if ansible_facts['architecture'] in ['64-bit', 'x86_64', 'amd64'] else 'arm64' }}"
    opampsupervisor_config_path: "{{ opampsupervisor_windows_config_path }}"
    opampsupervisor_storage_dir: "{{ opampsupervisor_windows_storage_dir }}"
    opampsupervisor_collector_executable: '{{ opampsupervisor_windows_install_dir }}\xscaler-collector.exe'

- name: Remove the otelcol-contrib and opampsupervisor install from earlier versions
  ansible.builtin.include_tasks: legacy-windows.yml

- name: Read the installed xScaler Collector version
  ansible.windows.win_shell: |
    $keys = 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Uninstall\*',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*'
    Get-ItemProperty -Path $keys -ErrorAction SilentlyContinue |
      Where-Object { $_.DisplayName -eq '{{ opampsupervisor_windows_product_name }}' } |
      Select-Object -First 1 -ExpandProperty DisplayVersion
  register: _opampsupervisor_installed
  changed_when: false
  check_mode: false

- name: Install xscaler-collector MSI
  ansible.windows.win_package:
    path: "{{ opampsupervisor_release_url }}/xscaler-collector_{{ xscaler_collector_version }}_windows_{{ opampsupervisor_arch }}.msi"
    state: present
  when: (_opampsupervisor_installed.stdout | default('') | trim) != opampsupervisor_msi_version
  notify: Restart xscaler-collector

- name: Render supervisor config
  ansible.windows.win_template:
    src: supervisor.yaml.j2
    dest: "{{ opampsupervisor_windows_config_path }}"
  no_log: true
  notify: Restart xscaler-collector

- name: Enable and start xscaler-collector
  ansible.windows.win_service:
    name: "{{ opampsupervisor_windows_service_name }}"
    start_mode: auto
    state: started
