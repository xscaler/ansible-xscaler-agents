---
# Install xscaler-collector on a dedicated network collector host. The
# opampsupervisor role installs the package and enrolls the supervisor; fleet
# manager owns collector config.

- name: Set network collector fleet labels
  ansible.builtin.set_fact:
    _xscaler_agent_labels_effective: "{{ {'agent_profile': 'network_collector'} | combine(xscaler_agent_labels | default({})) }}"

- name: Install and configure xscaler-collector
  ansible.builtin.include_role:
    name: opampsupervisor
  vars:
    opampsupervisor_agent_labels: "{{ _xscaler_agent_labels_effective }}"
