---
# Render the supervisor bootstrap config from the real role template. Run from
# the repo root:
#   ansible-playbook test/render.yml
- name: Render OpAMP supervisor bootstrap configs for validation
  hosts: localhost
  connection: local
  become: false
  gather_facts: false
  vars:
    ansible_managed: "rendered by test/render.yml"
    xscaler_opamp_endpoint: "wss://agents.xscalerlabs.com/v1/opamp"
    xscaler_enrollment_token: "xse_test000000000000000000000000"
    xscaler_agent_name: "render-test"
    xscaler_agent_labels:
      environment: test
      region: local
    opampsupervisor_agent_labels:
      agent_profile: linux_host
      environment: test
      region: local
    opampsupervisor_platform: linux
    opampsupervisor_collector_executable: /usr/bin/xscaler-collector
    opampsupervisor_storage_dir: /var/lib/xscaler-collector

  tasks:
    - name: Ensure output dir
      ansible.builtin.file:
        path: "{{ playbook_dir }}/output"
        state: directory
        mode: "0755"

    - name: Render Linux supervisor config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/opampsupervisor/templates/supervisor.yaml.j2"
        dest: "{{ playbook_dir }}/output/linux-supervisor.yaml"
        mode: "0644"

    - name: Render network collector supervisor config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/opampsupervisor/templates/supervisor.yaml.j2"
        dest: "{{ playbook_dir }}/output/network-supervisor.yaml"
        mode: "0644"
      vars:
        opampsupervisor_agent_labels:
          agent_profile: network_collector
          environment: test
          region: local

    - name: Render Windows supervisor config
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../roles/opampsupervisor/templates/supervisor.yaml.j2"
        dest: "{{ playbook_dir }}/output/windows-supervisor.yaml"
        mode: "0644"
      vars:
        opampsupervisor_agent_labels:
          agent_profile: windows_host
          environment: test
          region: local
        opampsupervisor_platform: windows
        opampsupervisor_collector_executable: 'C:\Program Files\xScaler Collector\xscaler-collector.exe'
        opampsupervisor_storage_dir: 'C:\ProgramData\xScaler Collector\state'

    - name: Read rendered configs
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/output/{{ item }}-supervisor.yaml"
      loop: [linux, network, windows]
      register: _rendered

    - name: Assert the supervisor config matches xscaler-collector packaging
      ansible.builtin.assert:
        that:
          - (item.content | b64decode) is not search('(?m)^\s*reports_remote_config:')
          - "'xscaler.distribution: xscaler-collector' in (item.content | b64decode)"
          - "'reports_heartbeat: true' in (item.content | b64decode)"
          - "'otelcol-contrib' not in (item.content | b64decode)"
        quiet: true
      loop: "{{ _rendered.results }}"
      loop_control:
        label: "{{ item.item }}"
