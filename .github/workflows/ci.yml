name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  XSCALER_COLLECTOR_VERSION: "0.6.0"

jobs:
  lint:
    name: Lint & syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ansible-core ansible-lint yamllint
      - name: Install collections
        run: ansible-galaxy collection install -r requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        run: ansible-lint
      - name: Syntax check
        run: |
          ansible-playbook --syntax-check playbooks/site.yml
          ansible-playbook --syntax-check playbooks/verify.yml
          ansible-playbook --syntax-check playbooks/linux-agents.yml
          ansible-playbook --syntax-check playbooks/windows-agents.yml
          ansible-playbook --syntax-check playbooks/network-collector.yml

  validate-configs:
    name: Render bootstrap and validate fleet configs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ansible-core
        run: pip install ansible-core
      - name: Render configs from the real role templates
        run: ansible-playbook test/render.yml
      - name: Download xscaler-collector
        run: |
          mkdir -p "$RUNNER_TEMP/xscaler-collector"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/xscaler/xscaler-agent/releases/download/v${XSCALER_COLLECTOR_VERSION}/xscaler-collector_${XSCALER_COLLECTOR_VERSION}_linux_amd64.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/xscaler-collector"
          "$RUNNER_TEMP/xscaler-collector/xscaler-collector" --version
      - name: Confirm required receivers exist
        run: |
          "$RUNNER_TEMP/xscaler-collector/xscaler-collector" components \
            | grep -E 'name: (snmp|netflow|host_metrics|journald|otlp_http)$'
      - name: Validate Linux fleet config
        run: |
          mkdir -p test/output/validated
          sed -E 's/\$\{secret:[A-Z0-9_.-]+\}/TEST_SECRET/g' examples/fleet-manager/linux-host.yaml > test/output/validated/linux-host.yaml
          "$RUNNER_TEMP/xscaler-collector/xscaler-collector" validate --config test/output/validated/linux-host.yaml
      - name: Validate network collector fleet config
        run: |
          mkdir -p test/output/validated
          sed -E 's/\$\{secret:[A-Z0-9_.-]+\}/TEST_SECRET/g' examples/fleet-manager/network-collector.yaml > test/output/validated/network-collector.yaml
          "$RUNNER_TEMP/xscaler-collector/xscaler-collector" validate --config test/output/validated/network-collector.yaml

  netflow-smoke:
    name: NetFlow parse smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send synthetic NetFlow and assert parsing
        run: bash test/netflow-smoke.sh

  e2e-linux:
    name: End-to-end Linux (systemd + role)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run otelcol_linux role in a systemd container
        run: bash test/e2e-linux.sh
